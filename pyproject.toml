[project]
name = "sextant"
version = "0.1.0"
description = "개발 활동을 기록해 개발 일지와 트러블슈팅 문서를 만드는 개인용 CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sextant = "sextant.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sextant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
